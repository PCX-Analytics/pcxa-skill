name: Quality

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-quality:
    name: Offline quality (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package and test tooling
        run: python -m pip install --disable-pip-version-check -e ".[dev]"
      - name: Check installed dependency metadata
        run: python -m pip check
      - name: Lint Python sources
        run: python -m ruff check .
      - name: Compile Python sources
        run: python -m compileall -q pcxa scripts
      - name: Validate release-version sources
        run: python scripts/validate_versions.py
      - name: Run full offline test suite
        run: python -m pytest -q
