name: Release

# Tag-triggered release. Push a `pcxa--v<MAJOR>.<MINOR>.<PATCH>` tag to
# the repo and this workflow will:
#
#   1. Verify the tag's version matches all 4 source-of-truth files
#      (pyproject.toml, pcxa/__init__.py, .claude-plugin/plugin.json,
#      .claude-plugin/marketplace.json — twice in marketplace).
#      If anything is out of sync the run fails before publishing.
#   2. Generate release notes from commit subjects since the previous
#      `pcxa--v*` tag.
#   3. Create the GitHub release.
#
# The recommended way to cut a release is `scripts/release.sh <version>`,
# which bumps the 4 files, commits, tags, and pushes — this workflow then
# takes over. Pushing a tag by hand also works as long as the version
# files match.

on:
  push:
    tags:
      - 'pcxa--v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to (re-)publish (e.g. pcxa--v0.3.4)'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve tag (push or workflow_dispatch)
        id: tagref
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            REF="${{ github.event.inputs.tag }}"
          else
            REF="${GITHUB_REF#refs/tags/}"
          fi
          echo "tag=$REF" >> "$GITHUB_OUTPUT"

      - name: Checkout the tag (full history for changelog)
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.tagref.outputs.tag }}
          fetch-depth: 0

      - name: Extract version from tag
        id: version
        env:
          TAG: ${{ steps.tagref.outputs.tag }}
        run: |
          VER="${TAG#pcxa--v}"
          if ! echo "$VER" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Tag $TAG does not match pcxa--vX.Y.Z"
            exit 1
          fi
          echo "tag=$TAG"     >> "$GITHUB_OUTPUT"
          echo "version=$VER" >> "$GITHUB_OUTPUT"

      - name: Set up supported Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install package and test tooling
        run: python -m pip install --disable-pip-version-check -e ".[dev]"

      - name: Run offline quality contract
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          python -m pip check
          python -m ruff check .
          python -m compileall -q pcxa scripts
          python scripts/validate_versions.py --tag "$TAG" --require-tag-at-head
          python -m pytest -q

      - name: Build release notes from commits since previous tag
        id: notes
        run: |
          set -euo pipefail
          PREV="$(git describe --tags --abbrev=0 --match='pcxa--v*' "${GITHUB_SHA}^" 2>/dev/null || true)"
          if [ -n "$PREV" ]; then
            RANGE="$PREV..${GITHUB_SHA}"
            HEADER="Changes since $PREV"
          else
            RANGE="${GITHUB_SHA}"
            HEADER="Initial tagged release"
          fi
          {
            echo "## $HEADER"
            echo
            git log "$RANGE" --pretty=format:'- %s' --reverse
            echo
          } > /tmp/notes.md
          {
            echo "notes<<EOF"
            cat /tmp/notes.md
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create or update GitHub release (idempotent)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
          VER: ${{ steps.version.outputs.version }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release $TAG exists — refreshing notes"
            gh release edit "$TAG" \
              --title "pcxa v$VER" \
              --notes-file /tmp/notes.md
          else
            gh release create "$TAG" \
              --verify-tag \
              --title "pcxa v$VER" \
              --notes-file /tmp/notes.md
          fi
