[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pcxa-cli"
version = "0.6.1"
description = "Command-line client and Claude Code skill for the PCXA construction-intelligence platform"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.9"
authors = [{ name = "Pablo Curiel" }]
keywords = ["pcxa", "claude-code", "construction", "project-management", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Office/Business",
    "Topic :: Utilities",
]
dependencies = []

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[project.urls]
Homepage = "https://github.com/PCX-Analytics/pcxa-skill"
Repository = "https://github.com/PCX-Analytics/pcxa-skill"
Issues = "https://github.com/PCX-Analytics/pcxa-skill/issues"

[project.scripts]
pcxa = "pcxa:main"

[tool.setuptools]
packages = ["pcxa", "pcxa.commands"]

[tool.setuptools.data-files]
"share/pcxa-cli" = ["skills/pcxa/SKILL.md"]
